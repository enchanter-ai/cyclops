# cyclops downstream server map (template)
#
# Copy this file to downstream.toml and point CYCLOPS_DOWNSTREAM at it:
#     export CYCLOPS_DOWNSTREAM=/etc/cyclops/downstream.toml
#
# Each [[server]] binds a REAL MCP server to a logical security role. The role
# name is any string — it just has to match the names patterns.toml uses. The
# shipped patterns.toml (or your CYCLOPS_PATTERNS override) declares which roles
# are untrusted / sensitive and which (role, tool) pairs are egress / privileged;
# every role it names must be declared here (checked at startup), and every
# declared egress/privileged sink must be a tool the bound server advertises.
#
# The default patterns.toml uses "web" (untrusted source), "filesystem"
# (sensitive store), "notify"/"post" (egress) and "admin"/"grant_access"
# (privileged) — rename all of them to your real servers and tools. No server,
# tool, or endpoint is hard-coded in Python.
#
# transport = "stdio"  launches the server as a child process (command + args).
# transport = "http"   connects to a Streamable-HTTP MCP endpoint (url).

[[server]]
name = "web"
transport = "http"
url = "https://web-mcp.internal.example/mcp"

[[server]]
name = "filesystem"
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/srv/agent/workspace"]

[[server]]
name = "notify"
transport = "http"
url = "https://notify-mcp.internal.example/mcp"

[[server]]
name = "admin"
transport = "stdio"
command = "python"
args = ["-m", "your_org.admin_mcp"]
