[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyclops"
version = "0.1.0"
description = "Detect and prevent toxic agent flows from a rogue MCP agent on an endpoint."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Enchanter Labs" }]
keywords = ["mcp", "ai-agents", "security", "toxic-flow", "provenance", "data-exfiltration", "endpoint-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = ["mcp>=1.0,<2.0", "networkx>=3.6.1"]

[project.urls]
Homepage = "https://github.com/enchanter-ai/cyclops"
Repository = "https://github.com/enchanter-ai/cyclops"
Issues = "https://github.com/enchanter-ai/cyclops/issues"
Changelog = "https://github.com/enchanter-ai/cyclops/blob/main/CHANGELOG.md"

[project.optional-dependencies]
http = ["uvicorn>=0.30", "starlette>=0.37"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
cyclops = "cyclops.proxy:main"

[tool.hatch.build.targets.wheel]
include = ["cyclops"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "I", "UP", "B", "SIM"]
ignore = ["E301", "E302", "E303", "E305", "E306"]

[tool.ruff.lint.isort]
lines-after-imports = 1

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["networkx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cyclops.proxy"]
disallow_untyped_decorators = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
