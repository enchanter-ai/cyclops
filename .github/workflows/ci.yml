name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check cyclops tests
      - name: Mypy
        run: mypy cyclops
      - name: Pytest
        run: pytest -q
      - name: Downstream config smoke (template declares every referenced role)
        run: python -c "from cyclops.downstream import load; from cyclops.config import assert_closure; names={s.server for s in load('downstream.example.toml')}; assert names == {'web','filesystem','notify','admin'}; assert_closure(names)"
